name: Build printer-arm64

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            file \
            gcc \
            libusb-1.0-0-dev

      - name: Download Go modules
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          go version
          go mod download

      - name: Run tests on host
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          go test ./...

      - name: Build linux/arm64 binary
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          CGO_ENABLED: "1"
        run: |
          go build -v -o printer-arm64 .
          chmod +x printer-arm64
          file printer-arm64

      - name: Upload printer-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer-arm64
          path: printer-arm64
          if-no-files-found: error

